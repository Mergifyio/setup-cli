name: Continuous Integration
permissions: read-all

on:
  pull_request:
    branches:
      - main
      - devs/**

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linters:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # yamllint and semgrep run from their published images (no host Python),
      # matching the actionlint step above. Renovate manages the tags + digests.
      - name: Lint YAML 🔍
        uses: docker://cytopia/yamllint:1@sha256:596fb19eb71e55ba5b2fa56d8c18a615ec82adc8d3bf2d73918cb78c8f3240fb
        with:
          args: .

      - name: Security scan 🔒
        uses: docker://semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
        with:
          # Set the entrypoint explicitly: this image has no ENTRYPOINT, and
          # pinning it keeps the step correct if a digest bump reintroduces one.
          entrypoint: semgrep
          # The short minimumReleaseAge in renovate.json is deliberate, and the
          # rule's suggested opt-out ("minimumReleaseAge": false) is invalid
          # per the Renovate schema, so the rule is excluded instead.
          args: --config=auto --error --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age

  autodoc:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Regenerate documentation
        run: ./generate-doc.sh

      - name: Verify Changed files
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error::Action documentation is out of date. Run \`./generate-doc.sh\`"
            exit 1
          fi

  test-install:
    timeout-minutes: 5
    # One runner per target triple install.sh supports, so every detection +
    # extraction path is exercised: linux+macos on both x86_64 and aarch64.
    # (Windows is added once install.sh ships a Windows path.)
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04        # x86_64-unknown-linux-gnu
          - ubuntu-26.04-arm    # aarch64-unknown-linux-gnu
          - macos-15-intel      # x86_64-apple-darwin
          - macos-15            # aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned mergify-cli
        id: pinned
        uses: ./
        with:
          mergify_cli_version: 2026.11.22

      - name: Assert pinned install
        env:
          VERSION: ${{ steps.pinned.outputs.mergify_cli_version }}
          # Must equal the with: input above; Renovate bumps both on each
          # mergify-cli release. Kept as a separate literal (not derived from
          # the input) so the assertion checks against a fixed expectation. The
          # name is mergify-specific so the Renovate customManager that bumps it
          # cannot collide with any other digit-led env added here later.
          EXPECTED_MERGIFY_CLI_VERSION: 2026.11.22
        run: |
          # Compare against the expected literal requested version (not the
          # action's own readback), so a regression that installs the wrong
          # version fails CI.
          test "$VERSION" = "$EXPECTED_MERGIFY_CLI_VERSION"
          test "$(mergify --version | awk '{print $NF}')" = "$EXPECTED_MERGIFY_CLI_VERSION"

      - name: Install latest mergify-cli
        id: latest
        uses: ./
        with:
          mergify_cli_version: latest

      - name: Assert latest install
        env:
          VERSION: ${{ steps.latest.outputs.mergify_cli_version }}
        run: |
          test -n "$VERSION"
          test "$(mergify --version | awk '{print $NF}')" = "$VERSION"

  test-install-retry:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Point raw.githubusercontent.com at an address that never answers
        run: |
          # 192.0.2.1 is reserved for documentation (RFC 5737): a connection
          # to it hangs, so the first download of install.sh times out.
          echo "192.0.2.1 raw.githubusercontent.com" | sudo tee -a /etc/hosts
          # Restore the name once curl is seen connecting to the dead address,
          # so the install can only succeed on a later attempt.
          restore_after_first_attempt() {
            until ss -tnH state syn-sent dst 192.0.2.1 | grep -q .; do sleep 0.2; done
            sudo sed -i "/raw.githubusercontent.com/d" /etc/hosts
            date -u +%T > "$RUNNER_TEMP/first-attempt-hung"
          }
          restore_after_first_attempt > /dev/null 2>&1 &

      - name: Install mergify-cli
        id: install
        uses: ./

      - name: Assert the install succeeded on a retry
        env:
          VERSION: ${{ steps.install.outputs.mergify_cli_version }}
        run: |
          test -f "$RUNNER_TEMP/first-attempt-hung"
          echo "First attempt hung on 192.0.2.1, name restored at $(cat "$RUNNER_TEMP/first-attempt-hung") UTC"
          test "$(mergify --version | awk '{print $NF}')" = "$VERSION"

  all-greens:
    if: ${{ !cancelled() }}
    needs:
      - linters
      - autodoc
      - test-install
      - test-install-retry
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
