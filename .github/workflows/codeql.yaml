name: CodeQL
permissions: read-all

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - devs/**
  schedule:
    - cron: 41 4 * * 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository's code is action.yml and the workflows; the actions
  # language covers both, including the composite action's shell step.
  analyze:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
